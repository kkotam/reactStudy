<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체</title>
</head>
<body>
    <script>
        let person = {
            name: "이정희",
            age:27,
            play: function(){
                // return this.name + "가 야구를 합니다."
                return `${this.name}가 야구를 합니다.`;

            }
        }

        console.log(person);
        console.log(typeof(person));//object

        console.log("이름", person.name);
        console.log("나이", person.age);
        console.log("활동 : ", person.play());
    </script>
</body>
</html>
