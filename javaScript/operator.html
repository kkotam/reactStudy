<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연산자</title>
</head>
<body>
    <script>
        console.log(10 == 10); //true
        console.log(10 == '10'); //true
        console.log(10 === '10'); //false
        console.log(10 !== '10'); //true
        console.log("=================================");

        //논리연산자
        let a = 12;
        let b = 22;
        console.log(a < b && a == 11); //false
        console.log(!(a > b)); //true
        console.log("=================================");

        let num = 7;
        let result;
        result = (num % 2 ==0) ? "짝수" : "홀수";
        console.log("결과:", result);
        console.log(` 결과: ${result}`); //백틱 안에 변수값 입력
        

    </script>
</body>
</html>
