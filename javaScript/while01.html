        //prompt("데이터", '힌트')

        while(true){
            let key = prompt("", 'y/n');
            if(key == 'y' || key == 'Y'){
                alert("반복합니다");

            }else if(key == 'n' || key == 'N'){
                alert("중단합니다");
                break;

            }else{
                alert("잘못된 입력입니다");

            }
        }
        console.log("프로그램을 종료합니다");
