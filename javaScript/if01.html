<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문 -  if</title>
</head>
<body>
    <script>
        let age = 17;

        if(age > 20){
            console.log("성인입니다");
        } else{
            console.log("미성년자입니다");
        }

        console.log("나이는" + age + "세 입니다")
    </script>
</body>
</html>
