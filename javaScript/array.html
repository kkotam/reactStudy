<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    //배열
    <h2>배열</h2>
    <script>
        //변수
        let season = "여름";
        console.log("계절 : ", season);

        //배열
        let seasons = ["봄","여름","가을","겨울"];
        console.log("계절 : ", seasons);
        console.log(typeof seasons); //object

        console.log(seasons[1]);

        let numbers = new Array(4);
        console.log(numbers.length); //배열크기


    </script>

</body>
</html>
