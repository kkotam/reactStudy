<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일변수 정의와 사용</title>
    <style>
        /*css변수정의*/
        :root{
            /*글자색정의*/
            --red-color:rgb(255, 0, 68);
            /*배경색정의*/
            --green-color:rgb(36, 207, 6);
            /*여백 1rem = 16px*/
            --my-2:0.5rem;
            --my-3:1rem;
        }
        h2{
            color: var(--red-color);
        }
        div{
            width: 30px;
            height: 30px;
            /* background-color: green; */
            background-color: var(--green-color);
            /* margin: 10px; */
            margin: var(--my-3);
            display: inline-block;
        }
    </style>
</head>
<body>
    <h2>스타일 변수</h2>
    <div></div>
    <div></div>
    
</body>
</html>
